name: Build APK

on:
  push:
    branches:
      - claude/peaceful-rubin-23t245
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: co-eink-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        if: github.ref == 'refs/heads/claude/peaceful-rubin-23t245'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Cờ E-ink - APK mới nhất"
          body: "Bản APK debug build tự động từ nhánh phát triển. Tải file app-debug.apk bên dưới rồi cài vào máy Likebook Mars."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
